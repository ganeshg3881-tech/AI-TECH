<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile card</title>
    <style>
        .profile-card {
            position: relative;
            border: 3px solid black;
            padding: 200px;
            margin: 300px 300px;
            margin: 300px 300px;
            align-items: center;
            border-radius: 20px;
            background-color:rgb(19, 214, 248);
        }

        img {
            position:absolute;
            top: 100px;
            right: 100px;
            width: 200px;
            height: 150px;
            border: 3px dotted black;
            object-fit: cover;
        }

        h2 {
            font-size:large;
            font-style: italic;
            color:blue;
        }

        h1 {
            position: relative;
            top: -200px;
            background-color: blue;
            color: aliceblue;
        }
        p{
            color:blue;
            font-style: italic;
        }
        button{
            padding: 10px 30px;
            background-color: rgb(4, 230, 34);
            color: white;
            margin: 10px 10px;
        }
        
    
    </style>
</head>

<body>
    <div class="profile-card">
        <h1>PROFILE CARD</h1>
        <div class="image">
            <img src="https://t4.ftcdn.net/jpg/05/19/89/97/360_F_519899761_kH6DsNBvULXhoSN2MVil1IUsRpSTNxvC.jpg">
        </div>
        <h2>NAME:PETER PARKER</h2>
        <p>He is the web developer and web designer.then he working for the <b>ROHIL TECHNOLOGIES</b> company.</p>
        <button>Follow</button>
    </div>
</body>

</html>
