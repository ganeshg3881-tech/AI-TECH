<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        grid-auto-rows: 90px;
        gap: 10px;
        padding-left: 300px;
        padding-right: 300px;
    }
    .frame{
        border: 3px solid rgb(10, 10, 10);
        overflow: hidden;
        border-radius: 25px;
    }    
    .frame img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        
    }
    .tall{
        grid-column: span 1;
        grid-row: span 2;
    }
</style>
<body>
    <div class="container">
        <div class="frame tall">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJ4U_Qlp-SUKXxmdzukQ6pib-i-fnp_OMYEucEY2-xpQ&s">
        </div>
        <div class="frame tall">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREBMAs1BixgYiFXlylOKs3til3vxFYbif6TZATxgz-Uw&s=10">
        </div>
