<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="task6.css">
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Please fill in your details to register.</p>
    <table>
        <tr>
            <td><h4>Full Name:</h4></td>
            <td><input type="text" placeholder="Enter full name"></td>
        </tr>
        <tr>
            <td><h4>Email Address:</h4></td>
            <td><input type="email" placeholder="Enter email address"></td>
        </tr>
        <tr>
            <td><h4>Mobile Number:</h4></td>
            <td><input type="tel" placeholder="Enter mobile number"></td>
        </tr>
        <tr>
            <td><h4>Date of Birth:</h4></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><h4>Gender:</h4></td>
            <td>
                <select>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><h4>Course</h4></td>
            <td><input list="course">
                <datalist id="course">
                <option value="B.Sc IT">
                <option value="B.Sc Computer science">
                <option value="B.Sc Maths">
                <option value="B.Sc Physics">
                    
                </datalist>
            </td>
        </tr>
        <tr>
            <td><h4>Preferred Mode:</h4></td>
            <td>
                <form>
                <input type="radio" name="preferred mode" value="Online">Online
                 <input type="radio" name="preferred mode" value="Offline">Offline
                  <input type="radio" name="preferred mode" value="Hybrid">Hybrid
                </form>
            </td>
        </tr>
        <tr>
            <td><h4>Address:</h4></td>
            <td><textarea rows="4" cols="40" placeholder="Enter address"></textarea></td>
        </tr>
    </table>
    <input type="submit" value="register" class="btn">
    <input type="reset" value="reset" class="btn">
</body>
</html>
