<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: inline-flex;
        width: 500px;
        height: 50px;
        background-color: grey;
    }
    .button{
        display: inline-flex;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: bold;
    }
    .button1{
        background-color:red ;
        color: black;
        transition: transform 3s;
    }
    .button1:hover{
        background-color: green;
        transform: scale(1.5);
    }
    .button2{
        background-color: red;
        color: black;
        transition: transform 3s;
    }
    .button2:hover {
        background-color: green;
        transform: translate(10px,10px);
    }
    .button3{
        background-color: red;
        color: black;
        transition: transform 3s;
    }
    .button3:hover{
        background-color: green;
        transform: rotate(270deg);
    }
    .icon{
        position: relative;
        width: 70px;
        height: 50px;
        background-color: red;
        color: black;
        transition: transform 3s;
    }
    .icon:hover{
        background-color: green;
        transform: scale(1.5);
    }
</style>
<body>
    <h1>Animated button collection</h1>
    <div class="container">
    <button class="button1">button 1</button>
    <button class="button2">button 2</button>
    <button class="button3">button 3</button>
    </div>
    <button class="icon">icon</button>
</body>
</html>
