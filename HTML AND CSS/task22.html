<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2{
        font-weight: bold;
        font-style: italic;
        text-align: center;
    }
    .trafficsignal{
        width: 110px;
        height: 310px;
        background-color: grey;
        border: 3px solid black;
        border-radius: 50px;
        margin-left: 600px;
    }
    .light{
        width: 70px;
        height: 70px;
        border-radius: 50%;
        padding: 10px;
        margin: 10px;
    }
    .red{
        animation: redlight 5s;
    }
    @keyframes redlight{
        0%{
            background-color:red;
        }
        50%{
            background-color:white;
        }
        100%{
            background-color: white;
        }
    }
    .yellow{
        animation: yellowlight 6s;
    }
    @keyframes yellowlight{
        0%{
            background-color: white;
        }
        50%{
            background-color:yellow;
        }
        100%{
            background-color: white;
        }
    }
    .green{
        animation: greenlight 9s;
    }
    @keyframes greenlight{
        0%{
            background-color: white;
        }
        50%{
            background-color:white;
        }
        100%{
            background-color: green;
        }
    }
    .road{
        width: 1200px;
        height: 150px;
        position: relative;
        top: 70px;
        background-color: rgb(102, 99, 99);
        border: 5px dashed black;
    }
    img{
        width: 250px;
        height: 140px;
        animation: move 10s;
    }
    @keyframes move{
        0%{
            transform: translate(0);
        }
        50%{
            transform: translate(0);
        }
        100%{
            transform: translate(950px);
        }
    }

    
</style>
<body>
    <h2>Animated Traffic Signal</h2>
    <div class="trafficsignal">
        <div class="red light"></div>
        <div class="yellow light"></div>
        <div class="green light"></div>
