<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        #demo {
            font-size: 30px;
            font-weight: bold;
            color: #333;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <p id="demo">Bee</p>

    <button onclick="changeText()">Change</button>

    <script>
        function changeText() {
            document.getElementById("demo").innerHTML = "Butterfly";
        }
    </script>

</body>

</html>
