<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
let studentName = prompt("Enter your name:");
let age = Number(prompt("Enter your age:"));
let department = prompt("Enter your department:");
let percentage = Number(prompt("Enter your percentage:"));

// Display the student profile
console.log("===== STUDENT PROFILE =====");
console.log(`Student Name: ${studentName}`);
console.log(`Age: ${age}`);
console.log(`Department: ${department}`);
console.log(`Percentage: ${percentage}%`);

// Display the data types
console.log("===== DATA TYPES =====");
console.log(`Name type: ${typeof studentName}`);
console.log(`Age type: ${typeof age}`);
console.log(`Department type: ${typeof department}`);
console.log(`Percentage type: ${typeof percentage}`);

// Welcome message
alert(`Welcome, ${studentName}! Your student profile has been created.`);

    </script>
</body>
</html>
